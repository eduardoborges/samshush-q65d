<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://economia.awesomeapi.com.br; object-src 'none'; base-uri 'none'">
    <title>Home — preview</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <script src="device.js" defer></script>
    <script src="ui.js" defer></script>
    <script src="quote.js" defer></script>
  </head>
  <body>
    <main class="home" aria-label="Início">
      <header class="top">
        <div class="now">
          <p class="date" id="date"></p>
          <time class="clock" id="clock" aria-label="Hora atual"></time>
        </div>
        <section class="quote" id="quote" aria-label="Cotação do dólar" hidden>
          <p class="quote-label">Dólar</p>
          <p class="quote-price" id="quote-price"></p>
          <p class="quote-detail"><span class="quote-change" id="quote-change"></span> <span id="quote-time"></span></p>
        </section>
      </header>

      <section class="launcher" aria-labelledby="selection-title">
        <h1 class="visually-hidden" id="selection-title">YouTube</h1>
        <nav class="tiles" aria-label="Apps">
          <button class="tile selected" data-id="youtube" tabindex="0" aria-label="YouTube">
            <span class="icon icon-youtube">
              <svg viewBox="0 0 100 60" aria-hidden="true">
                <rect x="32" y="17" width="36" height="26" rx="8" fill="#ff0033"></rect>
                <path d="M46 24L58 30L46 36Z" fill="#ffffff"></path>
              </svg>
            </span>
            <span class="tile-label">YouTube</span>
          </button>

          <button class="tile" data-id="stremio" tabindex="-1" aria-label="Stremio">
            <span class="icon icon-stremio">
              <svg viewBox="0 0 100 60" aria-hidden="true">
                <rect x="37" y="17" width="26" height="26" rx="5" transform="rotate(45 50 30)" fill="#7b5bf5"></rect>
                <path d="M46 24.5L56 30L46 35.5Z" fill="#ffffff"></path>
              </svg>
            </span>
            <span class="tile-label">Stremio</span>
          </button>

          <button class="tile" data-id="settings" tabindex="-1" aria-label="Ajustes">
            <span class="icon icon-settings">
              <svg viewBox="0 0 100 60" aria-hidden="true">
                <g transform="translate(50 30) scale(.42)">
                  <path d="M-9-39H9L12-29L19-25L30-28L39-12L31-5V5L39 12L30 28L19 25L12 29L9 39H-9L-12 29L-19 25L-30 28L-39 12L-31 5V-5L-39-12L-30-28L-19-25L-12-29Z" fill="#d1d1d6"></path>
                  <circle r="16" fill="#48484a"></circle>
                </g>
              </svg>
            </span>
            <span class="tile-label">Ajustes</span>
          </button>
        </nav>
      </section>
      <p class="action-error" id="action-error" role="alert" hidden></p>
    </main>
  </body>
</html>
