<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://economia.awesomeapi.com.br https://api.binance.com https://marine-api.open-meteo.com https://api.open-meteo.com; object-src 'none'; base-uri 'none'">
    <title>Home — preview</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <script src="device.js" defer></script>
    <script src="ui.js" defer></script>
    <script src="quote.js" defer></script>
    <script src="sea.js" defer></script>
    <script src="forecast.js" defer></script>
    <script src="moon.js" defer></script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <main class="home" aria-label="Início">
      <header class="top">
        <div class="now">
          <p class="date" id="date"></p>
          <time class="clock" id="clock" aria-label="Hora atual"></time>
          <section class="info" id="market" aria-label="Cotações" hidden>
            <p class="widget-label">Mercado</p>
            <ol class="info-list market-list" id="market-list"></ol>
          </section>
        </div>
        <div class="side">
          <section class="sea glass" id="sea" aria-label="Mar em Fortaleza" hidden>
            <div class="sea-now">
              <p class="widget-label">Ondas · Fortaleza</p>
              <p class="widget-value" id="sea-waves"></p>
              <p class="widget-detail" id="sea-detail"></p>
            </div>
            <div class="sea-tide">
              <p class="widget-label">Maré</p>
              <svg class="tide-chart" id="sea-chart" viewBox="0 0 300 72" aria-hidden="true"></svg>
              <p class="widget-detail" id="sea-tide"></p>
            </div>
            <div class="sea-air" id="sea-air" hidden>
              <p class="widget-label">Vento</p>
              <p class="widget-value" id="sea-wind"></p>
              <p class="widget-detail" id="sea-weather"></p>
            </div>
          </section>
          <div class="side-row">
            <section class="moon glass" id="moon" aria-label="Lua e maré grande" hidden>
              <p class="widget-label" id="moon-name"></p>
              <p class="widget-value moon-value">
                <svg class="moon-disc" viewBox="0 0 24 24" aria-hidden="true">
                  <circle class="moon-dark" cx="12" cy="12" r="11"></circle>
                  <path class="moon-lit" id="moon-lit"></path>
                </svg>
                <span id="moon-light"></span>
              </p>
              <p class="widget-detail" id="moon-tide"></p>
            </section>
            <section class="forecast glass" id="forecast" aria-label="Previsão do tempo em Fortaleza" hidden>
              <div>
                <p class="widget-label">Agora</p>
                <p class="widget-value" id="forecast-now"></p>
                <p class="widget-detail" id="forecast-now-detail"></p>
              </div>
              <div>
                <p class="widget-label">Hoje · <span id="forecast-0-date"></span></p>
                <p class="widget-value"><span id="forecast-0-high"></span> <span class="low" id="forecast-0-low"></span></p>
                <p class="widget-detail" id="forecast-0-detail"></p>
              </div>
              <div>
                <p class="widget-label">Amanhã · <span id="forecast-1-date"></span></p>
                <p class="widget-value"><span id="forecast-1-high"></span> <span class="low" id="forecast-1-low"></span></p>
                <p class="widget-detail" id="forecast-1-detail"></p>
              </div>
            </section>
          </div>
        </div>
      </header>

      <h1 class="visually-hidden" id="selection-title">YouTube</h1>
      <div class="shelves">
        <section class="shelf" aria-labelledby="apps-title">
          <h2 class="shelf-title" id="apps-title">Apps</h2>
          <nav class="tiles" aria-labelledby="apps-title">
            <button class="tile selected" data-id="youtube" tabindex="0" aria-label="YouTube">
              <span class="icon icon-youtube">
                <svg viewBox="0 0 100 56" aria-hidden="true">
                  <rect x="33" y="15" width="34" height="26" rx="8" fill="#ff0033"></rect>
                  <path d="M46 22L57 28L46 34Z" fill="#ffffff"></path>
                </svg>
              </span>
              <span class="tile-label">YouTube</span>
            </button>

            <button class="tile" data-id="stremio" tabindex="-1" aria-label="Stremio">
              <span class="icon icon-stremio">
                <svg viewBox="0 0 100 56" aria-hidden="true">
                  <rect x="37.5" y="15.5" width="25" height="25" rx="5" transform="rotate(45 50 28)" fill="#7b5bf5"></rect>
                  <path d="M46.5 22.8L55.5 28L46.5 33.2Z" fill="#ffffff"></path>
                </svg>
              </span>
              <span class="tile-label">Stremio</span>
            </button>

            <button class="tile" data-id="primevideo" tabindex="-1" aria-label="Prime Video">
              <span class="icon icon-primevideo">
                <svg viewBox="0 0 100 56" aria-hidden="true">
                  <text x="50" y="28" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">prime video</text>
                  <path d="M35 32.5Q50 39 64 32.5" fill="none" stroke="#1a98ff" stroke-width="2" stroke-linecap="round"></path>
                  <path d="M60.8 30.6L64.6 32.2L62.4 35.6" fill="none" stroke="#1a98ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </span>
              <span class="tile-label">Prime Video</span>
            </button>

            <button class="tile" data-id="tvplus" tabindex="-1" aria-label="Samsung TV Plus">
              <span class="icon icon-tvplus">
                <svg viewBox="0 0 100 56" aria-hidden="true">
                  <rect x="36" y="15" width="28" height="20" rx="3.5" fill="none" stroke="#ffffff" stroke-width="2.2"></rect>
                  <path d="M50 20V30M45 25H55" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"></path>
                  <path d="M44 40H56" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"></path>
                </svg>
              </span>
              <span class="tile-label">Samsung TV Plus</span>
            </button>

            <button class="tile" data-id="spotify" tabindex="-1" aria-label="Spotify">
              <span class="icon icon-spotify">
                <svg viewBox="0 0 100 56" aria-hidden="true">
                  <circle cx="50" cy="28" r="14" fill="#1ed760"></circle>
                  <path d="M41.2 23.6Q50 20.6 59.2 24.6M42.2 28.2Q50 25.9 57.6 29.2M43.2 32.5Q50 30.8 56 33.5" fill="none" stroke="#121212" stroke-width="2.6" stroke-linecap="round"></path>
                </svg>
              </span>
              <span class="tile-label">Spotify</span>
            </button>
          </nav>
        </section>

        <section class="shelf" aria-labelledby="inputs-title">
          <h2 class="shelf-title" id="inputs-title">Entradas</h2>
          <nav class="tiles" aria-labelledby="inputs-title">
            <button class="tile" data-id="tv" tabindex="-1" aria-label="TV ao vivo">
              <span class="icon icon-input glass">
                <svg viewBox="26 12 48 30" aria-hidden="true">
                  <path d="M44 14L50 20L56 14" fill="none" stroke="#f5f5f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                  <rect x="35" y="20" width="30" height="18" rx="3" fill="none" stroke="#f5f5f7" stroke-width="2"></rect>
                </svg>
                <span class="input-name">TV</span>
              </span>
              <span class="tile-label">TV ao vivo</span>
            </button>

            <button class="tile" data-id="hdmi-2" tabindex="-1" aria-label="HDMI 2">
              <span class="icon icon-input glass">
                <svg viewBox="26 16 48 24" aria-hidden="true">
                  <path d="M38 21H62V29L57.5 34H42.5L38 29Z" fill="none" stroke="#f5f5f7" stroke-width="2" stroke-linejoin="round"></path>
                  <path d="M44 25.5V29M48 25.5V29M52 25.5V29M56 25.5V29" stroke="#f5f5f7" stroke-width="1.6" stroke-linecap="round"></path>
                </svg>
                <span class="input-name">HDMI 2</span>
              </span>
              <span class="tile-label">HDMI 2</span>
            </button>

            <button class="tile" data-id="hdmi-1" tabindex="-1" aria-label="HDMI 1">
              <span class="icon icon-input glass">
                <svg viewBox="26 16 48 24" aria-hidden="true">
                  <path d="M38 21H62V29L57.5 34H42.5L38 29Z" fill="none" stroke="#f5f5f7" stroke-width="2" stroke-linejoin="round"></path>
                  <path d="M44 25.5V29M48 25.5V29M52 25.5V29M56 25.5V29" stroke="#f5f5f7" stroke-width="1.6" stroke-linecap="round"></path>
                </svg>
                <span class="input-name">HDMI 1</span>
              </span>
              <span class="tile-label">HDMI 1</span>
            </button>

            <button class="tile settings-button" data-id="settings" tabindex="-1" aria-label="Ajustes">
              <svg viewBox="-40 -40 80 80" aria-hidden="true">
                <path fill-rule="evenodd" d="M-9-39H9L12-29L19-25L30-28L39-12L31-5V5L39 12L30 28L19 25L12 29L9 39H-9L-12 29L-19 25L-30 28L-39 12L-31 5V-5L-39-12L-30-28L-19-25L-12-29ZM16 0A16 16 0 1 0-16 0A16 16 0 1 0 16 0Z"></path>
              </svg>
            </button>
          </nav>
        </section>
      </div>
      <p class="action-error glass" id="action-error" role="alert" hidden></p>
    </main>
  </body>
</html>
