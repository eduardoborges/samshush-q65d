[project]
name = "samshush"
version = "0.3.0"
description = "Exact-build privacy controls for the Samsung Q65D"
requires-python = ">=3.12,<3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
